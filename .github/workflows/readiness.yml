name: Customer readiness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_PUBLIC_FIREBASE_API_KEY: build-fixture-not-a-credential
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-myscouter.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-myscouter
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-myscouter.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123:web:fixture'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:readiness
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
